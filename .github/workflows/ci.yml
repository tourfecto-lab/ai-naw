name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint + static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, mbstring, pdo_mysql, curl, openssl, zip, intl
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check (all tracked PHP files)
        run: |
          errors=$(git ls-files '*.php' | grep -v '^vendor/' | xargs -P4 -n40 php -l 2>&1 | grep -v '^No syntax errors' || true)
          if [ -n "$errors" ]; then echo "$errors"; exit 1; fi
      - name: PHPStan (level 1, baseline)
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: tourfecto_test
          DB_USER: root
          DB_PASS: ''
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  tests:
    name: PHPUnit (ratchet, MariaDB 10.11)
    runs-on: ubuntu-latest
    services:
      # MariaDB مش MySQL 8: الهجرات بتستخدم ADD COLUMN/INDEX IF NOT EXISTS (صيغة MariaDB بس، 231 جملة
      # في 9 ملفات) وتعليقات الكود بتذكر أخطاء MariaDB من الإنتاج، فده الأقرب للبيئة الحقيقية.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: tourfecto_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s
          --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, mbstring, pdo_mysql, curl, openssl, zip, intl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Migration chain report (informational)
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: tourfecto_test
          DB_USER: root
          DB_PASS: ''
        run: |
          php tools/migration_report.php | head -220
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) AS tables_built FROM information_schema.tables WHERE table_schema='tourfecto_test'"
          mysql -h 127.0.0.1 -uroot -e "DROP DATABASE tourfecto_test; CREATE DATABASE tourfecto_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - name: PHPUnit (fails if known failures grow beyond the ratchet)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: tourfecto_test
          DB_USER: root
          DB_PASS: ''
          # عدد الإخفاقات المعروفة (أخطاء + إخفاقات) اللي مسموح بيها لحد ما تتصلّح. نزّله كل ما يتصلّح شيء.
          MAX_KNOWN_FAILURES: '48'
        run: |
          set +e
          # بذرة ثابتة: بعض الاختبارات بتعتمد على الترتيب، والبذرة العشوائية كانت بتغيّر النتيجة بين تشغيلتين
          vendor/bin/phpunit --configuration tests/phpunit.xml --order-by=random --random-order-seed=1793197154 | tee phpunit.out
          line=$(grep -E '^Tests: ' phpunit.out | tail -1)
          errors=$(echo "$line" | grep -oE 'Errors: [0-9]+' | grep -oE '[0-9]+')
          failures=$(echo "$line" | grep -oE 'Failures: [0-9]+' | grep -oE '[0-9]+')
          total=$(( ${errors:-0} + ${failures:-0} ))
          echo "known failing tests: $total (max $MAX_KNOWN_FAILURES)"
          if [ -z "$line" ]; then echo 'PHPUnit did not finish (no summary line)'; exit 1; fi
          [ "$total" -le "$MAX_KNOWN_FAILURES" ]
